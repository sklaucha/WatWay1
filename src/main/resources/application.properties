spring.application.name=WatWay

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/WatWay
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Mantiene la sesión de la base abierta hasta que se arma la respuesta
# (es el comportamiento por defecto; declararlo explícito saca el warning)
spring.jpa.open-in-view=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=6000000

# Silencia un aviso informativo de Spring Security: usamos nuestro propio
# AuthenticationProvider (ApplicationConfig) y eso es intencional
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
